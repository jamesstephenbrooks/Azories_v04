<!DOCTYPE html>
<html>
<head>
  <title>Story Templates Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 40px;
    }
  </style>
</head>
<body>
  <div style="max-width: 700px; margin: 0 auto; background: #1f2937; border-radius: 16px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);">
    <h2 style="color: #fff; font-size: 24px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 28px;">⚡</span> AI Story Creator
    </h2>
    
    <!-- Templates Section -->
    <div style="margin-bottom: 24px;">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
        <span style="font-size: 18px;">💡</span>
        <h3 style="color: #9ca3af; font-size: 14px; font-weight: 600;">Need inspiration? Choose a template</h3>
      </div>
      
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
        <!-- Magical Adventure -->
        <button style="display: flex; flex-direction: column; align-items: flex-start; padding: 12px; border-radius: 12px; border: 2px solid #374151; background: transparent; cursor: pointer; text-align: left; transition: all 0.2s;" onmouseover="this.style.borderColor='#8b5cf6'; this.style.background='rgba(139,92,246,0.05)'" onmouseout="this.style.borderColor='#374151'; this.style.background='transparent'">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <span style="font-size: 20px;">🧙</span>
            <span style="font-weight: 600; font-size: 14px; color: #fff;">Magical Adventure</span>
          </div>
          <p style="font-size: 12px; color: #9ca3af; line-height: 1.4; margin: 0;">Discovers a hidden door in their school that leads to...</p>
        </button>
        
        <!-- Animal Friends -->
        <button style="display: flex; flex-direction: column; align-items: flex-start; padding: 12px; border-radius: 12px; border: 2px solid #374151; background: transparent; cursor: pointer; text-align: left; transition: all 0.2s;" onmouseover="this.style.borderColor='#8b5cf6'; this.style.background='rgba(139,92,246,0.05)'" onmouseout="this.style.borderColor='#374151'; this.style.background='transparent'">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <span style="font-size: 20px;">🦁</span>
            <span style="font-weight: 600; font-size: 14px; color: #fff;">Animal Friends</span>
          </div>
          <p style="font-size: 12px; color: #9ca3af; line-height: 1.4; margin: 0;">Leo is scared of the dark and learns to be brave with...</p>
        </button>
        
        <!-- Space Explorer -->
        <button style="display: flex; flex-direction: column; align-items: flex-start; padding: 12px; border-radius: 12px; border: 2px solid #374151; background: transparent; cursor: pointer; text-align: left; transition: all 0.2s;" onmouseover="this.style.borderColor='#8b5cf6'; this.style.background='rgba(139,92,246,0.05)'" onmouseout="this.style.borderColor='#374151'; this.style.background='transparent'">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <span style="font-size: 20px;">🚀</span>
            <span style="font-weight: 600; font-size: 14px; color: #fff;">Space Explorer</span>
          </div>
          <p style="font-size: 12px; color: #9ca3af; line-height: 1.4; margin: 0;">Crash lands on a friendly alien planet and must find...</p>
        </button>
        
        <!-- Under the Sea -->
        <button style="display: flex; flex-direction: column; align-items: flex-start; padding: 12px; border-radius: 12px; border: 2px solid #374151; background: transparent; cursor: pointer; text-align: left; transition: all 0.2s;" onmouseover="this.style.borderColor='#8b5cf6'; this.style.background='rgba(139,92,246,0.05)'" onmouseout="this.style.borderColor='#374151'; this.style.background='transparent'">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <span style="font-size: 20px;">🌊</span>
            <span style="font-weight: 600; font-size: 14px; color: #fff;">Under the Sea</span>
          </div>
          <p style="font-size: 12px; color: #9ca3af; line-height: 1.4; margin: 0;">Discovers a sunken treasure chest guarded by a grumpy...</p>
        </button>
        
        <!-- School Days -->
        <button style="display: flex; flex-direction: column; align-items: flex-start; padding: 12px; border-radius: 12px; border: 2px solid #374151; background: transparent; cursor: pointer; text-align: left; transition: all 0.2s;" onmouseover="this.style.borderColor='#8b5cf6'; this.style.background='rgba(139,92,246,0.05)'" onmouseout="this.style.borderColor='#374151'; this.style.background='transparent'">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <span style="font-size: 20px;">🏫</span>
            <span style="font-weight: 600; font-size: 14px; color: #fff;">School Days</span>
          </div>
          <p style="font-size: 12px; color: #9ca3af; line-height: 1.4; margin: 0;">The new kid at school discovers a secret talent that...</p>
        </button>
        
        <!-- Dragon Friend -->
        <button style="display: flex; flex-direction: column; align-items: flex-start; padding: 12px; border-radius: 12px; border: 2px solid #374151; background: transparent; cursor: pointer; text-align: left; transition: all 0.2s;" onmouseover="this.style.borderColor='#8b5cf6'; this.style.background='rgba(139,92,246,0.05)'" onmouseout="this.style.borderColor='#374151'; this.style.background='transparent'">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <span style="font-size: 20px;">🐉</span>
            <span style="font-weight: 600; font-size: 14px; color: #fff;">Dragon Friend</span>
          </div>
          <p style="font-size: 12px; color: #9ca3af; line-height: 1.4; margin: 0;">Finds a tiny lost dragon egg in the garden and must...</p>
        </button>
      </div>
    </div>
    
    <p style="color: #6b7280; font-size: 12px; text-align: center; margin-top: 16px;">Click any template to auto-fill the form fields</p>
  </div>
</body>
</html>
